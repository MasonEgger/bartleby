site:
  title: "Bartleby"
  url: "https://bartleby.dev"
  description: "A batteries-included Python static site generator built for humans and agents."
  author: "Mason Egger"

content_types:
  guides:
    path: guides/posts
    readtime: true
    excerpt_separator: "<!-- more -->"
    taxonomies:
      - tags
    metadata:
      audience:
        type: string
        choices:
          - new-user
          - existing-user
          - plugin-author
          - theme-author
  reference:
    path: reference/pages
    # These pages never end an excerpt by hand, so the first paragraph is the excerpt.
    # This marker is not "<!-- more -->" because configuration.md prints that string in a code block.
    excerpt_separator: "<!-- end-excerpt -->"
    taxonomies:
      - tags

taxonomies:
  tags:
    slug_format: "{slug}"

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts: concepts/
  # Guides and Reference are content types, which nav keeps as single links.
  # Listing their pages here is what gives their pages a section sidebar.
  - Guides:
      - All Guides: guides/
      - Choose and Customize a Theme: guides/posts/choose-and-customize-a-theme.md
      - Write a Theme: guides/posts/write-a-theme.md
      - Override a Single Theme Template: guides/posts/override-theme-template.md
      - Add a Custom Jinja2 Filter: guides/posts/add-jinja-filter.md
      - Validate Post Metadata at Build Time: guides/posts/validate-metadata.md
      - Write a Custom Shortcode: guides/posts/write-a-shortcode.md
      - Inject Content with a Hook: guides/posts/inject-content-with-hook.md
      - Configure AI Crawler Directives: guides/posts/ai-crawler-directives.md
  - Reference:
      - All Reference Pages: reference/
      - bartleby.yml Configuration: reference/pages/configuration.md
      - CLI Commands: reference/pages/cli.md
      - Themes: reference/pages/themes.md
      - Front Matter Fields: reference/pages/front-matter-fields.md
      - Template Context: reference/pages/template-context.md
      - Plugin Hook Events: reference/pages/plugin-hooks.md
      - Shortcodes: reference/pages/shortcodes.md
      - Markdown Extensions: reference/pages/markdown-extensions.md
      - Agent Output Formats: reference/pages/agent-surface.md
      - Build Pipeline: reference/pages/build-pipeline.md
      - Error Messages: reference/pages/errors.md

theme:
  name: scrivener
  features:
    - search
    - search.highlight
    - nav.tabs
    - nav.sidebar
    - nav.section-index
    - nav.back-to-top
    - content.code.copy
    - color-mode.toggle

exclude_patterns:
  - "_drafts/**"
  - "_*.md"
  - ".git/**"

ai:
  llms_txt: true
  llms_full_txt: true
  markdown_variants: true

dev_server:
  host: "127.0.0.1"
  port: 8000
