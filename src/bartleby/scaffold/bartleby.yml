site:
  title: "${name}"
  url: "https://example.com"
  description: "A Bartleby site."

theme:
  name: scrivener
  features:
    - search
    - search.highlight
    - nav.tabs
    - nav.sidebar
    - nav.back-to-top
    - content.code.copy
    - color-mode.toggle

nav:
  - Home: index.md
  - Blog: blog/

content_types:
  blog:
    path: blog/posts
    readtime: true
    excerpt_separator: "<!-- more -->"
    taxonomies:
      - tags

taxonomies:
  tags:
    slug_format: "{slug}"

exclude_patterns:
  - "_drafts/**"
  - "_*.md"
  - ".git/**"
