{% extends "base.html" %}
{% block content %}
{% set posts = page.custom_metadata.posts or [] %}
<section class="taxonomy-term">
  <h1>{{ page.title }}</h1>
  <p>Posts tagged with this term:</p>
  <ul>
    {% for post in posts %}
    <li><a href="{{ post.output_url }}">{{ post.title }}</a></li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
