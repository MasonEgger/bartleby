{% extends "base.html" %}
{% block content %}
<section class="taxonomy-term">
  <h1>{{ page.title }}</h1>
  <p>Posts tagged with this term:</p>
  <ul>
    {% for taxonomy_page in pages %}
    <li><a href="{{ taxonomy_page.output_url }}">{{ taxonomy_page.title }}</a></li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
