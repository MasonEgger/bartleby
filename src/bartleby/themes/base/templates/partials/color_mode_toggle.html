{# Color-mode switch shared by the bundled themes: a sun and a moon in a track, with a thumb over the active mode. #}
{# The thumb position follows data-theme on <html>, which the pre-paint script in base.html sets, so it never flashes. #}
<button
  type="button"
  role="switch"
  class="theme-toggle"
  aria-label="Dark mode"
  x-data="{ dark: document.documentElement.dataset.theme === 'dark' }"
  x-bind:aria-checked="dark ? 'true' : 'false'"
  x-on:click="dark = !dark; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; try { localStorage.setItem('bartleby-color-mode', dark ? 'dark' : 'light') } catch (e) {}">
  <span class="theme-toggle-thumb" aria-hidden="true"></span>
  <svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="theme-toggle-icon theme-toggle-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
</button>
