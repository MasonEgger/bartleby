{# Material search modal markup. The engine (index fetch, lunr query, ?h= highlighting) is base's #}
{# static/js/search.js; this partial only binds to its bartlebySearch component. #}
<div class="search-modal" x-cloak x-data="bartlebySearch()" x-on:keydown.escape.window="open && close()">
  <button type="button" class="search-trigger" x-ref="trigger" x-on:click="show()" aria-label="Open search" aria-haspopup="dialog">
    Search
  </button>
  <div class="search-overlay" x-show="open" x-cloak>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search" x-on:click.outside="open && close()">
      <div class="search-head">
        <input
          type="search"
          class="search-input"
          placeholder="Search"
          aria-label="Search the site"
          autocomplete="off"
          x-ref="input"
          x-model="query"
          x-on:input.debounce.150ms="search()"
          x-on:keydown.enter.prevent="go()">
        <button type="button" class="search-close" x-on:click="close()" aria-label="Close search">Close</button>
      </div>
      <p class="search-status" role="status" aria-live="polite" x-text="status()"></p>
      <ul class="search-results">
        <template x-for="result in results" :key="result.href">
          <li>
            <a x-bind:href="result.href">
              <span class="search-result-title" x-effect="mark($el, result.title)"></span>
              <span class="search-result-snippet" x-effect="mark($el, result.snippet)"></span>
            </a>
          </li>
        </template>
      </ul>
    </div>
  </div>
</div>
