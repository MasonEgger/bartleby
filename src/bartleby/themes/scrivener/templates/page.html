{% extends "base.html" %}
{# Scrivener page: a single reading column with the margin rule. Step 13 adds the docs grid around it. #}
{% block content %}
<div class="layout-prose">
  <article class="prose-column">
    <div class="prose dark:prose-invert max-w-none">
      <h1>{{ page.title }}</h1>
      {{ page.content | safe if page.content else "" }}
    </div>
  </article>
</div>
{% endblock %}
